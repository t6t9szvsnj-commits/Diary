name: Обновить данные и выложить

on:
  push:
    branches: [main]
  schedule:
    # Раз в час, в 7 минут: в ровный час очередь у GitHub самая длинная.
    - cron: "7 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages: ${{ steps.check.outputs.pages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Тесты
        run: python -m unittest discover -s tests -t .
      # Пока GitHub Pages не включён, выкладывать некуда. Не падаем, а
      # пропускаем выкладку — иначе письмо об ошибке приходило бы каждый час.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" --silent 2>/dev/null; then
            echo "pages=on" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::GitHub Pages не включён: Settings → Pages → Source: GitHub Actions"
            echo "pages=off" >> "$GITHUB_OUTPUT"
          fi
      - id: pages
        if: steps.check.outputs.pages == 'on'
        uses: actions/configure-pages@v5
      - name: Собрать данные
        if: steps.check.outputs.pages == 'on'
        env:
          LK_LOGIN: ${{ secrets.LK_LOGIN }}
          LK_PASSWORD: ${{ secrets.LK_PASSWORD }}
        run: |
          mkdir _site
          cp -r app/. _site/
          python scripts/fetch_data.py --out _site/data.json \
            --previous "${{ steps.pages.outputs.base_url }}/data.json"
      - if: steps.check.outputs.pages == 'on'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.pages == 'on'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
