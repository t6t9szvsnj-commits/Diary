name: Разведка ЛК (временно)
on:
  push:
    branches: [probe-lk]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: curl -s https://ipinfo.io/country || true
      - run: python scripts/probe_lk.py
